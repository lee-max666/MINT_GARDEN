<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민트가든 - 날씨 연동 식물 키우기 & 운세</title>
    <!-- 민트가든 로고를 썸네일(Open Graph)로 지정 -->
    <meta property="og:title" content="민트가든 - 오늘의 식물 육성 운세">
    <meta property="og:description" content="실시간 날씨에 따라 나만의 식물을 키우고 오늘의 운세를 확인해보세요!">
    <meta property="og:image" content="images/mint_garden_logo.png">
    
    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #81c784;
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px;
            background: var(--primary-color);
            color: white;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        header img.logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #1b5e20;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* 가드닝 화면 스타일 */
        .pot-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
        }

        .pot-container img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }

        .bug-obj {
            position: absolute;
            cursor: pointer;
            width: 45px;
            height: 45px;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .gauge-group {
            margin: 15px 0;
            text-align: left;
        }

        .gauge-label {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .gauge-bar-bg {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
        }

        .gauge-bar-fill {
            height: 100%;
            width: 50%;
            transition: width 0.3s ease;
        }

        .action-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 10px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .action-btn:active {
            background: var(--accent-color);
            color: white;
        }

        .hidden {
            display: none !important;
        }

        .dev-reset {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888;
            background: none;
            border: 1px dashed #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <img src="images/mint_garden_logo.png" alt="민트가든 로고" class="logo" onerror="this.style.display='none'">
        <h1>🌿 민트가든 식물 육성 운세</h1>
    </header>

    <div class="container">

        <!-- 1단계: 시작 화면 -->
        <div id="screen-start" class="card">
            <h2>오늘의 정원 방문을 환영합니다!</h2>
            <p>하루에 한 번, 실시간 날씨의 영향을 받는 나만의 식물을 심고 오늘의 운세를 확인해보세요.</p>
            
            <div style="margin: 20px 0; text-align: left;">
                <label for="region-select" style="font-weight: bold; display: block; margin-bottom: 8px;">📍 지역 선택:</label>
                <select id="region-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
                    <option value="서울">서울특별시</option>
                    <option value="부산">부산광역시</option>
                    <option value="대전">대전광역시</option>
                    <option value="제주">제주특별자치도</option>
                    <option value="강릉">강원 강릉시</option>
                </select>
            </div>

            <button class="btn" id="start-btn">식물 키우기</button>
            <p id="limit-msg" style="color: #d32f2f; font-size: 0.9rem; margin-top: 15px;" class="hidden">오늘은 이미 식물을 키우셨습니다! 내일 다시 도전해주세요.</p>
        </div>

        <!-- 2단계: 육성 및 가드닝 화면 -->
        <div id="screen-game" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #666;">
                <span id="game-location-info">📍 서울 · ☀️ 21°C</span>
                <span id="timer-display" style="font-weight: bold; color: var(--primary-color);">남은 시간: 1:15</span>
            </div>

            <div class="pot-container" id="pot-area">
                <img id="plant-img" src="images/stage_seed.png" alt="성장 중인 식물" onerror="this.src='images/soil_base.png'">
                <!-- 돌발 벌레가 나타날 자리 -->
                <div id="bug-container"></div>
            </div>

            <p id="status-desc" style="font-weight: bold; color: var(--primary-color);">씨앗을 심었습니다. 정성껏 돌봐주세요!</p>

            <div class="gauge-group">
                <div class="gauge-label"><span>💧 수분 조절</span><span id="water-val">50%</span></div>
                <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="water-bar" style="background-color: #42a5f5; width: 50%;"></div></div>
            </div>

            <div class="gauge-group">
                <div class="gauge-label"><span>☀️ 햇빛 조절</span><span id="sun-val">50%</span></div>
                <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="sun-bar" style="background-color: #ffa726; width: 50%;"></div></div>
            </div>

            <div class="action-btns">
                <button class="action-btn" onclick="addWater()">💦 물 주기</button>
                <button class="action-btn" onclick="toggleSun()">🌤️ 차광막</button>
                <button class="action-btn" onclick="addFertilizer()">✨ 거름주기</button>
            </div>
        </div>

        <!-- 3단계: 결과 및 운세 카드 화면 -->
        <div id="screen-result" class="card hidden">
            <h2>✨ 오늘의 육성 결과 & 운세 ✨</h2>
            <div class="pot-container" style="background: #fff; border: 2px dashed var(--accent-color);">
                <img id="result-plant-img" src="" alt="완성된 식물">
            </div>
            
            <h3 id="result-title" style="margin: 10px 0; color: var(--primary-color);">[육성 성공: 상태 좋음] 장미</h3>
            <p id="result-fortune" style="background: #f9fbe7; padding: 15px; border-radius: 8px; font-style: italic; line-height: 1.5;"></p>

            <button class="btn" onclick="downloadCardImage()">이미지 저장하기</button>
            <br>
            <button class="dev-reset" onclick="resetDailyLimit()" style="margin-top: 15px;">🔄 (테스트용) 오늘 기록 초기화하기</button>
        </div>

        <!-- 개발자 테스트용 초기화 버튼 (시작 화면용) -->
        <button class="dev-reset" onclick="resetDailyLimit()">🔄 [Dev] 일일 제한 초기화</button>

    </div>

    <script>
        // 12종 식물 데이터베이스 (카테고리별 성공/실패 이미지 매칭)
        const plantDatabase = [
            // 꽃 (3)
            { name: "장미", category: "꽃", success: "images/plant_rose_success.png", failed: "images/plant_rose_failed.png", fortune: "오늘은 작은 노력으로도 큰 결실을 맺는 찬란한 하루가 될 것입니다." },
            { name: "해바라기", category: "꽃", success: "images/plant_sunflower_success.png", failed: "images/plant_sunflower_failed.png", fortune: "당신의 밝은 미소가 주변 사람들에게 행운과 기쁨을 전달합니다." },
            { name: "네잎클로버", category: "꽃", success: "images/plant_clover_success.png", failed: "images/plant_clover_failed.png", fortune: "뜻밖의 행운이나 소중한 기회가 찾아오는 대길의 하루입니다!" },
            // 관엽식물 (3)
            { name: "몬스테라", category: "관엽식물", success: "images/plant_monstera_success.png", failed: "images/plant_monstera_failed.png", fortune: "주변 환경이 안정되고 마음의 평온을 찾게 되는 평화로운 날입니다." },
            { name: "다육식물", category: "관엽식물", success: "images/plant_succulent_success.png", failed: "images/plant_succulent_failed.png", fortune: "차분하고 묵묵하게 준비해온 일에서 실속을 톡톡히 챙기게 됩니다." },
            { name: "선인장", category: "관엽식물", success: "images/plant_cactus_success.png", failed: "images/plant_cactus_failed.png", fortune: "어려운 역경 속에서도 강인한 의지로 목표를 달성할 수 있습니다." },
            // 야채/채소 (3)
            { name: "상추", category: "야채", success: "images/plant_lettuce_success.png", failed: "images/plant_lettuce_failed.png", fortune: "가까운 지인과의 소소한 소통 속에서 유익한 정보를 얻게 됩니다." },
            { name: "방울토마토", category: "야채", success: "images/plant_tomato_success.png", failed: "images/plant_tomato_failed.png", fortune: "작은 아이디어가 알찬 성과로 이어져 주변의 칭찬을 받게 됩니다." },
            { name: "당근", category: "야채", success: "images/plant_carrot_success.png", failed: "images/plant_carrot_failed.png", fortune: "숨겨져 있던 보물 같은 기회나 능력을 발휘할 순간이 옵니다." },
            // 과일 (3)
            { name: "딸기", category: "과일", success: "images/plant_strawberry_success.png", failed: "images/plant_strawberry_failed.png", fortune: "달콤하고 기분 좋은 만남이나 선물이 기다리고 있는 하루입니다." },
            { name: "레몬", category: "과일", success: "images/plant_lemon_success.png", failed: "images/plant_lemon_failed.png", fortune: "상큼한 변화가 필요한 시점입니다. 새로운 도전을 시작해보세요!" },
            { name: "포도", category: "과일", success: "images/plant_grape_success.png", failed: "images/plant_grape_failed.png", fortune: "그동안 공들였던 인간관계나 프로젝트에서 알찬 수확이 있습니다." }
        ];

        let gameState = {
            region: "서울",
            plant: null,
            water: 50,
            sun: 50,
            timeLeft: 75, // 1분 15초
            timerId: null,
            bugActive: false,
            bugType: null,
            score: 0
        };

        // 초기 실행 시 일일 제한 체크
        window.addEventListener('DOMContentLoaded', () => {
            checkDailyLimit();
        });

        document.getElementById('start-btn').addEventListener('click', startGame);

        function checkDailyLimit() {
            const lastPlayed = localStorage.getItem('mint_garden_last_played');
            const today = new Date().toISOString().slice(0, 10);
            if (lastPlayed === today) {
                document.getElementById('start-btn').disabled = true;
                document.getElementById('limit-msg').classList.remove('hidden');
            }
        }

        function resetDailyLimit() {
            localStorage.removeItem('mint_garden_last_played');
            alert('테스트용 기록이 초기화되었습니다. 다시 시작할 수 있습니다!');
            location.reload();
        }

        function startGame() {
            const regionSelect = document.getElementById('region-select');
            gameState.region = regionSelect.value;
            
            // 랜덤 식물 배정
            gameState.plant = plantDatabase[Math.floor(Math.random() * plantDatabase.length)];
            gameState.water = 50;
            gameState.sun = 50;
            gameState.timeLeft = 75;
            gameState.score = 50;

            // 화면 전환
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('game-location-info').innerText = `📍 ${gameState.region} · ☀️ 22°C`;

            // 게임 타이머 및 루프 시작
            runGameLoop();
        }

        function runGameLoop() {
            const plantImg = document.getElementById('plant-img');
            const statusDesc = document.getElementById('status-desc');
            const timerDisplay = document.getElementById('timer-display');

            gameState.timerId = setInterval(() => {
                gameState.timeLeft--;
                
                let min = Math.floor(gameState.timeLeft / 60);
                let sec = gameState.timeLeft % 60;
                timerDisplay.innerText = `남은 시간: ${min}:${sec < 10 ? '0' : ''}${sec}`;

                // 단계별 이미지 변경 (공용 이미지 활용)
                if (gameState.timeLeft === 50) {
                    plantImg.src = "images/stage_seed.png";
                    statusDesc.innerText = "씨앗에서 싹이 트고 있습니다!";
                } else if (gameState.timeLeft === 25) {
                    plantImg.src = "images/stage_sprout.png";
                    statusDesc.innerText = "무럭무럭 자라나는 중입니다!";
                }

                // 게이지 자연 감소
                gameState.water = Math.max(0, gameState.water - 0.8);
                gameState.sun = Math.max(0, gameState.sun - 0.6);
                updateGauges();

                // 랜덤 벌레 출몰 (남은 시간 40초 ~ 15초 사이)
                if (gameState.timeLeft === 40 && !gameState.bugActive) {
                    spawnBug();
                }

                // 종료 조건
                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerId);
                    finishGame();
                }
            }, 1000);
        }

        function updateGauges() {
            document.getElementById('water-bar').style.width = gameState.water + '%';
            document.getElementById('water-val').innerText = Math.round(gameState.water) + '%';
            document.getElementById('sun-bar').style.width = gameState.sun + '%';
            document.getElementById('sun-val').innerText = Math.round(gameState.sun) + '%';
        }

        function addWater() {
            gameState.water = Math.min(100, gameState.water + 15);
            updateGauges();
        }

        function toggleSun() {
            gameState.sun = Math.min(100, gameState.sun + 20);
            updateGauges();
        }

        function addFertilizer() {
            gameState.water = Math.min(100, gameState.water + 5);
            gameState.sun = Math.min(100, gameState.sun + 5);
            updateGauges();
        }

        function spawnBug() {
            gameState.bugActive = true;
            const bugs = ['images/bug_aphid.png', 'images/bug_caterpillar.png', 'images/bug_snail.png'];
            const chosenBug = bugs[Math.floor(Math.random() * bugs.length)];
            
            const bugDiv = document.getElementById('bug-container');
            bugDiv.innerHTML = `<img src="${chosenBug}" class="bug-obj" style="top: 20px; right: 20px;" onclick="removeBug()" alt="해충">`;
            document.getElementById('status-desc').innerText = "⚠️ 경고! 해충이 나타났습니다! 빨리 클릭해서 잡으세요!";
        }

        function removeBug() {
            document.getElementById('bug-container').innerHTML = '';
            gameState.bugActive = false;
            gameState.score += 20;
            document.getElementById('status-desc').innerText = "벌레를 퇴치했습니다! 안전해요.";
        }

        function finishGame() {
            // 오늘 날짜 저장 (일일 제한)
            const today = new Date().toISOString().slice(0, 10);
            localStorage.setItem('mint_garden_last_played', today);

            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            // 최종 성공/실패 판정 (수분/햇빛 평균치 기준)
            const avgState = (gameState.water + gameState.sun) / 2;
            const isSuccess = avgState >= 30 && !gameState.bugActive;

            const resultImg = document.getElementById('result-plant-img');
            const resultTitle = document.getElementById('result-title');
            const resultFortune = document.getElementById('result-fortune');

            if (isSuccess) {
                resultImg.src = gameState.plant.success;
                resultTitle.innerText = `[육성 성공: 상태 좋음] ${gameState.plant.name}`;
                resultTitle.style.color = "var(--primary-color)";
            } else {
                resultImg.src = gameState.plant.failed;
                resultTitle.innerText = `[육성 실패: 시듦] ${gameState.plant.name}`;
                resultTitle.style.color = "#d32f2f";
            }

            resultFortune.innerHTML = `<strong>🌱 [${gameState.region} 민트가든 운세]</strong><br>${gameState.plant.fortune}`;
        }

        function downloadCardImage() {
            alert('운세 카드 저장 기능은 추후 캡처 라이브러리와 연동하여 제공될 예정입니다! 현재 화면을 캡처하거나 공유해보세요.');
        }
    </script>
</body>
</html>
